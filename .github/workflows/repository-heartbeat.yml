name: Record Repository Activity

on:
  schedule:
    - cron: "17 03 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6

      - name: Record the heartbeat
        run: |
          printf '%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/repository-heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/repository-heartbeat.txt
          git commit -m "Record scheduled repository activity [skip ci]"
          git push
